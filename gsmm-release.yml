name: Release Build

on:
  push:
    tags:
      - 'v*'  # Trigger quando fai push di un tag tipo v1.0.0

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: gsmm
            asset_name: gsmm-linux-x86_64

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: gsmm.exe
            asset_name: gsmm-windows-x86_64.exe

          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: gsmm
            asset_name: gsmm-macos-x86_64

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: gsmm
            asset_name: gsmm-macos-aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
